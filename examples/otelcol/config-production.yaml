# Pilot configuration: local application/agent input, TLS-protected backend export.
# Queue is in memory, not durable across restarts. See docs/production.md.
# Annotation only: all spans are forwarded. No Redis or trace-ID routing required.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
  jevtraces:
    api_key: ${env:JEV_API_KEY}
    mode: annotate
    timeout: 3s
    min_inference_interval: 200ms # At most 5 request admissions/second per instance.
    score_ttl: 15m
    slow_span_threshold: 1s
    workers: 2
    queue_size: 256
    cache_size: 10000
    max_state_bytes: 16384
    # Use normalized span names; disable this if names may contain sensitive data.
    include_span_name: true
    protected_operations:
      - POST /checkout
    context_attributes:
      - service.name
      - service.namespace
      - deployment.environment.name
    span_attributes:
      - http.request.method
      - http.route
      - rpc.system
      - rpc.service
      - rpc.method
      - db.system.name
      - db.operation.name
      - messaging.system
      - messaging.operation.type
  batch:
    timeout: 1s

exporters:
  otlp:
    endpoint: ${env:OTLP_BACKEND_ENDPOINT}
    tls:
      insecure: false
    headers:
      authorization: ${env:OTLP_BACKEND_AUTHORIZATION}
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 1000
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 300s

service:
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, jevtraces, batch]
      exporters: [otlp]
    # Accept metrics on the same OTLP receiver; no Jev metrics inference here.
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp]
