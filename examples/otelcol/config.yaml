# Annotation only: all spans are forwarded. No Redis or trace-ID routing required.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
  jevtraces:
    api_key: ${env:JEV_API_KEY}
    mode: annotate
    timeout: 3s
    score_ttl: 15m
    slow_span_threshold: 1s
    workers: 2
    queue_size: 256
    cache_size: 10000
    max_state_bytes: 16384
    # Use normalized span names; disable this if names may contain sensitive data.
    include_span_name: true
    protected_operations:
      - POST /checkout
    context_attributes:
      - service.name
      - service.namespace
      - deployment.environment.name
    span_attributes:
      - http.request.method
      - http.route
      - rpc.system
      - rpc.service
      - rpc.method
      - db.system.name
      - db.operation.name
      - messaging.system
      - messaging.operation.type
  batch:
    timeout: 1s

exporters:
  debug:
    verbosity: detailed

service:
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, jevtraces, batch]
      exporters: [debug]
    # Accept metrics on the same OTLP receiver; no Jev metrics inference here.
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
